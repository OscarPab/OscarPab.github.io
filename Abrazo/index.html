<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrazo virtual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: #FFE4E1; /* Color rosa pálido */
            font-family: 'Comic Neue', cursive;
        }
        :root {
            --loading-width: 160px;
            --loading-heigth: 23px;
        }
        body {
            width: 100vw;
            height: 100vh;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        main {
            text-align: center;
            width: 90vw;
        }
        .box {
            display: inline-block;
            border: solid black 4px;
            width: var(--loading-width);
            background-color: white;
        }
        .loading-box {
            height: var(--loading-heigth);
            width: var(--loading-width);
            background-color: blueviolet;
            animation: loading 5s;
        }
        #state-message {
            font-size: larger;
            font-weight: bold;
            color: rgb(109, 109, 109);
        }
        @keyframes loading {
            0% {
                width: 0;
            }
            100% {
                width: var(--loading-width);
            }
        }
        #title,
        #result {
            margin-top: 8px;
            margin-bottom: 10px;
        }
        #me {
            margin-top: 8px;
            margin-bottom: 14px;
        }
        .box {
            margin-top: 3px;
        }
        .heart,
        .rose {
            position: absolute;
            animation: float 6s ease-in-out infinite;
            background: none; /* Sin fondo */
        }
        .heart {
            color: red;
            font-size: 24px;
        }
        .rose {
            color: deeppink;
            font-size: 24px;
        }
        @keyframes float {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-200px);
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 id="title">Enviando abrazo virtual</h1>
        <div>
            <img id="me" src="penguin.svg" alt="">
        </div>
        <div class="box">
            <div class="loading-box"></div>
        </div>
        <h3 id="state-message">cargando...</h3>
        <h2 id="result">&nbsp;</h2>
        <div id="animations"></div>
        <script>
            setTimeout(function() {
                const message = document.getElementById('result');
                message.innerHTML = "Abrazo enviado!";
                // Crear corazones y rosas flotando
                const animations = document.getElementById('animations');
                for (let i = 0; i < 10; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = `${Math.random() * 100}vw`;
                    heart.style.top = `${Math.random() * 100}vh`;
                    animations.appendChild(heart);

                    const rose = document.createElement('div');
                    rose.className = 'rose';
                    rose.innerHTML = '🌹';
                    rose.style.left = `${Math.random() * 100}vw`;
                    rose.style.top = `${Math.random() * 100}vh`;
                    animations.appendChild(rose);
                }
            }, 6200);
            setTimeout(function() {
                const message = document.getElementById('state-message');
                message.innerHTML = "&nbsp;";
            }, 6000);
        </script>
    </main>
</body>
</html>
